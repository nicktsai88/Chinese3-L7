<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>國文：張釋之執法 選擇題大挑戰</title>
    <link href="https://fonts.googleapis.com/css2?family=CwTeXYen:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        /* --- 變數定義 --- */
        :root {
            --primary-color: #2c3e50;   /* 官服藍 (標準模式) */
            --secondary-color: #c0392b; /* 硃批紅 */
            --speed-color: #8e44ad;     /* 極速紫 (刷題模式) */
            --bg-color: #f4f6f7;
            --text-color: #2c3e50;
            --accent-color: #e74c3c;
            --correct-color: #27ae60;
            --wrong-color: #c0392b;
            --locked-color: #bdc3c7;
            --favorite-color: #e91e63;
        }

        body { 
            font-family: 'CwTeXYen', "Microsoft JhengHei", Arial, sans-serif; 
            max-width: 1000px; margin: 0 auto; padding: 20px; 
            background-color: var(--bg-color); color: var(--text-color);
            /* 背景圖片設定 */
            background-image: url('images/background.jpg');
            background-size: cover; background-position: center; background-attachment: fixed;
            min-height: 100vh;
        }

        /* 遮罩層，確保文字在背景圖上清晰 */
        body::before {
            content: ""; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255, 255, 255, 0.85); z-index: -1;
        }

        h1 { font-size: 2.5em; color: var(--primary-color); text-align: center; margin-top: 0; text-shadow: 2px 2px 0px rgba(255,255,255,0.5); font-weight: bold; letter-spacing: 2px;}
        h2, h3 { color: var(--primary-color); text-align: center; }

        /* --- 主要容器 --- */
        .quiz-container { 
            background: rgba(255, 255, 255, 0.95); padding: 25px; border-radius: 15px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.2); border: 4px solid var(--primary-color); 
            position: relative; overflow: hidden; min-height: 500px;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in { animation: fadeIn 0.4s ease-out; }

        /* --- 按鈕通用樣式 --- */
        .btn {
            background-color: var(--primary-color); color: #FFF; border: none;
            padding: 10px 24px; font-size: 1.2em; border-radius: 8px;
            cursor: pointer; transition: 0.2s; box-shadow: 0 4px 0 rgba(0,0,0,0.2);
            font-family: inherit; font-weight: bold; margin: 5px; display: inline-block;
        }
        .btn:hover { transform: translateY(-2px); opacity: 0.95; }
        .btn:active { transform: translateY(2px); box-shadow: none; }
        .btn:disabled { background-color: #bdc3c7; cursor: not-allowed; box-shadow: none; transform: none; }
        
        .btn-green { background-color: var(--correct-color); }
        .btn-red { background-color: var(--accent-color); }
        .btn-purple { background-color: var(--speed-color); }
        .btn-gray { background-color: #7f8c8d; }
        .btn-blue { background-color: #2980b9; }
        .btn-pink { background-color: var(--favorite-color); }
        
        .btn-sm { padding: 6px 12px; font-size: 0.9em; box-shadow: 0 2px 0 rgba(0,0,0,0.2); }
        .btn-music { background-color: #95A5A6; opacity: 0.7; }
        .btn-music.playing { background-color: #3498DB; opacity: 1; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(52, 152, 219, 0.4); } 70% { box-shadow: 0 0 0 6px rgba(52, 152, 219, 0); } 100% { box-shadow: 0 0 0 0 rgba(52, 152, 219, 0); } }

        /* --- 登入畫面 --- */
        input[type="text"] {
            padding: 10px; font-size: 1.3em; border: 2px solid var(--primary-color); background-color: #FFF;
            border-radius: 8px; margin: 10px; font-family: inherit; text-align: center; width: 80%; max-width: 300px;
        }
        .avatar-selection { display: flex; justify-content: center; gap: 15px; margin: 20px 0; }
        .avatar-option {
            width: 70px; height: 70px; border-radius: 50%; border: 3px solid transparent;
            cursor: pointer; transition: 0.2s; object-fit: cover; background: #FFF;
        }
        .avatar-option.selected { border-color: var(--primary-color); transform: scale(1.1); box-shadow: 0 0 10px var(--primary-color); }
        .user-tag { 
            display: inline-flex; align-items: center; background: #FFF; border: 1px solid var(--primary-color); 
            padding: 5px 10px; border-radius: 20px; cursor: pointer; margin: 3px; font-size: 0.9em;
        }

        /* --- 儀表板 (Dashboard) --- */
        .dashboard-layout { display: flex; flex-wrap: wrap; gap: 20px; height: 100%; }
        .dashboard-left { flex: 2; min-width: 300px; border-right: 2px dashed #bdc3c7; padding-right: 15px; }
        .dashboard-right { flex: 1; min-width: 250px; display: flex; flex-direction: column; gap: 15px; }

        @media (max-width: 768px) {
            .dashboard-layout { flex-direction: column; }
            .dashboard-left { border-right: none; border-bottom: 2px dashed #bdc3c7; padding-bottom: 20px; padding-right: 0; }
        }

        /* 關卡 Grid */
        .level-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 15px; margin-top: 15px;
        }
        .level-btn-grid {
            aspect-ratio: 1; display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: #FFF; border: 3px solid var(--primary-color); border-radius: 10px; cursor: pointer;
            transition: 0.2s; position: relative; color: var(--primary-color);
        }
        .level-btn-grid:hover:not(:disabled) { transform: translateY(-3px); background: #ecf0f1; }
        .level-btn-grid:disabled { background: #eee; border-color: #bdc3c7; color: #999; cursor: not-allowed; }
        .level-num { font-size: 1.5em; font-weight: bold; }
        .level-stars { font-size: 0.8em; margin-top: 3px; }

        /* 右側面板區塊 */
        .panel-box {
            background: #FFF; border-radius: 10px; padding: 15px; border: 2px solid #bdc3c7; box-shadow: 0 3px 5px rgba(0,0,0,0.05);
        }
        .panel-box.purple-theme { border-color: var(--speed-color); background: #fbf4ff; }
        .panel-box h3 { margin: 0 0 10px 0; font-size: 1.2em; border-bottom: 1px solid rgba(0,0,0,0.1); padding-bottom: 5px;}
        
        .stat-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 1.1em; color: #555; }
        .resume-btn-area { margin-top: 10px; text-align: center; }

        /* --- 瀑布流刷題模式 (Waterfall) --- */
        .waterfall-container { position: relative; height: 100%; }
        
        /* Sticky Header */
        .waterfall-header {
            position: sticky; top: 0; z-index: 100;
            background: rgba(255, 255, 255, 0.98);
            border-bottom: 3px solid var(--primary-color);
            padding: 10px; margin: -25px -25px 20px -25px; /* 抵消 container padding */
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: flex; justify-content: space-between; align-items: center;
        }
        .wf-title { font-size: 1.4em; font-weight: bold; color: var(--primary-color); margin-left: 15px;}
        .wf-score-board { font-size: 1.2em; font-weight: bold; margin-right: 15px; color: var(--correct-color); background: #ebf5eb; padding: 5px 15px; border-radius: 20px;}
        
        .wf-progress-bg { position: absolute; bottom: 0; left: 0; width: 100%; height: 5px; background: #eee; }
        .wf-progress-fill { height: 100%; background: var(--correct-color); width: 0%; transition: 0.3s; }

        /* 題目卡片 */
        .wf-card {
            background: #FFF; border: 2px solid #e0e0e0; border-radius: 10px;
            padding: 20px; margin-bottom: 25px; position: relative;
            box-shadow: 0 3px 8px rgba(0,0,0,0.05); transition: 0.3s;
        }
        .wf-card.answered-correct { border-color: var(--correct-color); background-color: #f0fff4; }
        .wf-card.answered-wrong { border-color: var(--wrong-color); background-color: #fff5f5; }
        
        /* 卡片工具列 */
        .wf-card-tools { position: absolute; top: 15px; right: 15px; display: flex; gap: 10px; }
        .wf-tool-btn { font-size: 1.5em; cursor: pointer; transition: 0.2s; background: none; border: none; padding: 0; }
        .wf-tool-btn:hover { transform: scale(1.2); }
        .wf-delete-btn { color: #bdc3c7; display: none; } /* 預設隱藏 */
        .wf-delete-btn:hover { color: var(--wrong-color); }
        
        .wf-q-text { font-size: 1.4em; font-weight: bold; color: #2c3e50; margin-bottom: 15px; line-height: 1.5; padding-right: 60px; }
        .wf-img { max-width: 100%; max-height: 200px; display: block; margin: 10px auto; border-radius: 5px; border: 1px solid #ddd; }
        
        .wf-options { list-style: none; padding: 0; }
        .wf-option-btn {
            width: 100%; padding: 12px 15px; margin: 5px 0; text-align: left;
            background: #FFF; border: 2px solid #bdc3c7; border-radius: 8px;
            cursor: pointer; font-size: 1.2em; font-family: inherit; transition: 0.2s;
            position: relative;
        }
        .wf-option-btn:hover:not(:disabled) { border-color: var(--primary-color); background: #fbfbfb; }
        .wf-option-btn:disabled { cursor: default; opacity: 1; }
        
        /* 狀態樣式 */
        .wf-option-btn.correct { background-color: #d4edda; border-color: var(--correct-color); color: #155724; font-weight: bold; }
        .wf-option-btn.wrong { background-color: #f8d7da; border-color: var(--wrong-color); color: #721c24; }
        .wf-option-btn.missed { border-color: var(--correct-color); color: var(--correct-color); border-style: dashed; }

        .wf-explanation {
            margin-top: 15px; padding: 15px; background: #eaf2f8; 
            border-left: 5px solid #2980b9; border-radius: 5px; 
            display: none; animation: fadeIn 0.3s; line-height: 1.6; font-size: 1.1em;
        }

        /* --- 傳統模式 (Standard) --- */
        .standard-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 10px; margin-bottom: 15px; }
        .progress-bar-container { width: 100%; height: 10px; background: #eee; border-radius: 5px; overflow: hidden; margin-top: 5px; }
        .progress-bar-fill { height: 100%; background: var(--primary-color); width: 0%; transition: 0.3s; }
        .standard-q-box { background: white; padding: 20px; border-radius: 10px; border: 1px solid #ddd; margin-bottom: 20px; box-shadow: 0 4px 0 rgba(0,0,0,0.05); }

        /* --- 其他 --- */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 2000; display: none; justify-content: center; align-items: center; }
        .modal-content { background: #FFF; padding: 20px; border-radius: 10px; max-width: 90%; max-height: 90%; text-align: center; border: 4px solid var(--primary-color); }
        .collection-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 15px; }
        .card-item { aspect-ratio: 2/3; background: #ddd; border-radius: 8px; overflow: hidden; cursor: pointer; border: 2px solid white; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .card-item img { width: 100%; height: 100%; object-fit: cover; }
        .card-item.locked { filter: grayscale(1); opacity: 0.7; cursor: default; position: relative; }
        
        .empty-state { text-align: center; padding: 40px; color: #7f8c8d; font-size: 1.2em; }
    </style>
</head>
<body>

<div class="quiz-container">
    <audio id="bgm-player"></audio>

    <!-- 1. 歡迎畫面 -->
    <div id="welcome-screen" class="fade-in">
        <h1>國文：張釋之執法 選擇題大挑戰</h1>
        <div style="font-size: 4em; margin: 20px; text-align:center;">⚖️📜🏛️</div>
        <p style="text-align: center; color: #2c3e50;">請輸入大名，準備進入漢代廷尉府！</p>
        
        <div style="text-align:center;">
            <input type="text" id="username" placeholder="閣下尊姓大名..." />
        </div>
        
        <div class="avatar-selection">
            <img src="images/avatar_boy1.png" class="avatar-option selected" onclick="selectAvatar('avatar_boy1.png', this)">
            <img src="images/avatar_boy2.png" class="avatar-option" onclick="selectAvatar('avatar_boy2.png', this)">
            <img src="images/avatar_girl1.png" class="avatar-option" onclick="selectAvatar('avatar_girl1.png', this)">
            <img src="images/avatar_girl2.png" class="avatar-option" onclick="selectAvatar('avatar_girl2.png', this)">
        </div>

        <div id="quick-login-area" class="quick-login-area" style="text-align: center;"></div>
        
        <div style="text-align:center; margin-top: 30px;">
            <button class="btn" onclick="loginAndStart()">📜 擊鼓鳴冤 (進入)</button>
        </div>
    </div>

    <!-- 2. 儀表板 (Dashboard) -->
    <div id="dashboard-screen" style="display: none;" class="fade-in">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 2px solid #bdc3c7;">
            <div style="display:flex; align-items:center; gap: 10px;">
                <img id="dash-avatar" src="" style="width:50px; height:50px; border-radius:50%; border:2px solid var(--primary-color);">
                <div>
                    <div style="font-size: 0.9em; color: #7f8c8d;">廷尉</div>
                    <div id="dash-name" style="font-size: 1.5em; font-weight: bold; color: var(--primary-color);"></div>
                </div>
            </div>
            <div>
                 <button id="btn-music-dash" class="btn btn-sm btn-music" onclick="toggleMusic()">🎵</button>
                 <button class="btn btn-sm btn-gray" onclick="logout()">🚪 退堂</button>
            </div>
        </div>

        <div class="dashboard-layout">
            <!-- 左側：標準闖關 -->
            <div class="dashboard-left">
                <h2 style="text-align: left; margin-bottom: 15px;">🧪 標準闖關 <small style="font-size:0.5em; color:#7f8c8d;">(70分及格)</small></h2>
                <div id="standard-resume-area" style="display:none; margin-bottom: 15px; background: #e8f6f3; padding: 10px; border-radius: 8px; border: 1px solid var(--correct-color); text-align: center;">
                    <span style="color: var(--correct-color); font-weight: bold;">📝 發現未完成的卷宗！</span>
                    <button class="btn btn-sm btn-green" onclick="resumeStandardQuiz()">↪️ 繼續上次的闖關</button>
                </div>
                <div id="level-grid" class="level-grid">
                    <!-- JS 生成關卡 -->
                </div>
            </div>

            <!-- 右側：極速刷題與工具 -->
            <div class="dashboard-right">
                <!-- 刷題區 -->
                <div class="panel-box purple-theme">
                    <h3 style="color: var(--speed-color);">⚡ 極速刷題區</h3>
                    <p style="font-size: 0.9em; color: #666; margin: 5px 0;">全範圍題目，一滑到底！</p>
                    <button class="btn btn-purple" style="width: 100%; margin: 10px 0 5px 0;" onclick="initWaterfallMode('speed')">🚀 開始刷題 (全範圍)</button>
                </div>

                <!-- 工具區 -->
                <div class="panel-box">
                    <h3>📂 卷宗管理</h3>
                    <div class="stat-row">
                        <span>📕 錯題本</span>
                        <span id="dash-mistake-count" style="font-weight:bold; color:var(--wrong-color);">0</span>
                    </div>
                    <button class="btn btn-red btn-sm" style="width:100%;" onclick="initWaterfallMode('mistake')">複習錯題</button>
                    
                    <div class="stat-row" style="margin-top: 15px;">
                        <span>💖 收藏夾</span>
                        <span id="dash-fav-count" style="font-weight:bold; color:var(--favorite-color);">0</span>
                    </div>
                    <button class="btn btn-pink btn-sm" style="width:100%;" onclick="initWaterfallMode('favorite')">查看收藏</button>
                </div>

                <div class="panel-box">
                    <h3>🏆 成就</h3>
                    <button class="btn btn-blue btn-sm" style="width:100%; margin-bottom: 5px;" onclick="showCollection()">🎴 執法圖鑑</button>
                    <button class="btn btn-green btn-sm" style="width:100%;" onclick="showHistory()">📜 審判紀錄</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 3. 標準闖關模式 (Standard Quiz) -->
    <div id="quiz-content" style="display: none;" class="fade-in">
        <div class="standard-header">
            <div>
                <h3 id="std-level-title" style="margin:0;">第 X 回</h3>
                <div class="progress-bar-container"><div id="std-progress-bar" class="progress-bar-fill"></div></div>
            </div>
            <div style="text-align: right;">
                <div style="font-size: 0.9em; color: #7f8c8d;">卷宗</div>
                <div style="font-size: 1.2em; font-weight: bold;"><span id="std-current">1</span> / <span id="std-total">20</span></div>
            </div>
            <div style="margin-left: 10px;">
                <button class="btn btn-sm btn-pink" id="std-fav-btn" onclick="toggleFavoriteStandard()">🤍</button>
                <button class="btn btn-sm btn-gray" onclick="pauseStandardQuiz()">🏠 暫離</button>
            </div>
        </div>

        <div class="standard-q-box">
            <div id="std-question-text" style="font-size: 1.5em; font-weight: bold; margin-bottom: 15px;"></div>
            <img id="std-question-img" style="display: none; max-width: 100%; max-height: 250px; margin: 0 auto 15px auto;">
            <div id="std-options-area"></div>
        </div>

        <div id="std-explanation" class="wf-explanation" style="margin-bottom: 20px;"></div>
        <button id="std-next-btn" class="btn" style="width: 100%; display: none;" onclick="nextStandardQuestion()">下一題 ➡️</button>
    </div>

    <!-- 4. 瀑布流刷題模式 (Waterfall Mode) -->
    <div id="waterfall-screen" style="display: none; height: 100%;" class="fade-in">
        <div class="waterfall-header">
            <div style="display:flex; align-items:center;">
                <button class="btn btn-sm btn-gray" onclick="exitWaterfallMode()">🏠 返回</button>
                <span id="wf-mode-title" class="wf-title">極速刷題</span>
            </div>
            <div id="wf-score-display" class="wf-score-board">答對: 0</div>
            <div class="wf-progress-bg"><div id="wf-progress-bar" class="wf-progress-fill"></div></div>
        </div>

        <div id="waterfall-list" style="padding-bottom: 50px;">
            <!-- JS 生成卡片 -->
        </div>
    </div>

    <!-- 5. 結算畫面 -->
    <div id="score-box" style="display: none; text-align: center;" class="fade-in">
        <h2 style="color: #2c3e50;">🎉 審判完成！</h2>
        <p style="font-size: 4em; margin: 10px 0; font-weight: bold; color: #c0392b; font-family: 'Times New Roman', serif;"><span id="final-score"></span> 分</p>
        <div id="score-comment" style="font-size: 1.5em; margin-bottom: 25px; color: #e67e22;"></div>
        <div id="unlock-msg" style="color: var(--correct-color); font-weight: bold; display:none; margin-bottom: 15px; font-size: 1.5em;">🔓 下一回審判已開啟！</div>
        
        <div style="display: flex; justify-content: center; gap: 15px; flex-wrap: wrap;">
            <button class="btn" onclick="returnToDash()">🗺️ 返回儀表板</button>
        </div>
    </div>

    <!-- 6. 附屬畫面 (紀錄、圖鑑) -->
    <div id="history-screen" style="display: none;" class="fade-in">
        <h2>📜 歷代廷尉榜</h2>
        <ul id="history-list" style="list-style: none; padding: 0;"></ul>
        <div style="text-align: center; margin-top: 20px;"><button class="btn" onclick="returnToDash()">🗺️ 返回</button></div>
    </div>

    <div id="collection-screen" style="display: none;" class="fade-in">
        <h2>🎴 執法圖鑑</h2>
        <div id="collection-grid" class="collection-grid"></div>
        <div style="text-align: center; margin-top: 20px;"><button class="btn" onclick="returnToDash()">🗺️ 返回</button></div>
    </div>

    <!-- 彈窗 -->
    <div id="card-modal" class="modal-overlay" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <button class="btn btn-sm btn-red" style="position:absolute; top:-15px; right:-15px; border-radius:50%; width:30px; height:30px; padding:0;" onclick="closeModal()">×</button>
            <img id="modal-img" src="" style="max-width:100%; max-height:70vh;">
            <h3 id="modal-title" style="margin-top:10px;"></h3>
        </div>
    </div>

</div>

<script>
    // --- Config & State ---
    const LEVEL_CONFIG = [20, 20, 20, 20, 20, 20, 20, 20, 10]; // 170題
    const PASS_SCORE = 70;
    const APP_PREFIX = 'zhang_';
    const PLAYLIST = ['sounds/bgm1.mp3', 'sounds/bgm2.mp3', 'sounds/bgm3.mp3'];

    let allQuestions = [];
    let userName = "";
    let currentAvatar = "avatar_boy1.png";
    let bgmPlayer = document.getElementById('bgm-player');
    let currentTrack = 0;
    let isPlaying = false;

    // 音效
    let audioCorrect = new Audio('sounds/correct.mp3'); 
    let audioFail = new Audio('sounds/fail.mp3');
    bgmPlayer.volume = 0.3; bgmPlayer.onended = () => { currentTrack = (currentTrack + 1) % PLAYLIST.length; playMusic(); };

    // --- Init ---
    fetch('questions.json')
        .then(res => res.json())
        .then(data => { 
            allQuestions = data; 
            renderQuickLogin(); 
        })
        .catch(e => {
            console.error(e);
            alert("題目載入失敗，請確認 questions.json 存在");
        });

    // --- Helpers ---
    const getKey = (key) => `${APP_PREFIX}${userName}_${key}`;
    const getLetter = (str) => { let m = str && str.match(/[A-Za-z]/); return m ? m[0].toUpperCase() : ""; };
    const getStorage = (key, def) => { let v = localStorage.getItem(key); return v ? JSON.parse(v) : def; };
    const setStorage = (key, val) => localStorage.setItem(key, JSON.stringify(val));

    // --- Music ---
    function playMusic() { if(!PLAYLIST.length) return; bgmPlayer.src = PLAYLIST[currentTrack]; bgmPlayer.play().then(()=>{isPlaying=true; updateMusicBtns();}).catch(()=>{}); }
    function toggleMusic() { if(bgmPlayer.paused) { if(!bgmPlayer.src) bgmPlayer.src=PLAYLIST[currentTrack]; bgmPlayer.play(); isPlaying=true; } else { bgmPlayer.pause(); isPlaying=false; } updateMusicBtns(); }
    function updateMusicBtns() { 
        document.querySelectorAll('.btn-music').forEach(b => {
            b.classList.toggle('playing', isPlaying);
            b.style.opacity = isPlaying ? '1' : '0.7';
        });
    }

    // --- Login ---
    function selectAvatar(img, el) { 
        currentAvatar = img; 
        document.querySelectorAll('.avatar-option').forEach(x => x.classList.remove('selected'));
        el.classList.add('selected');
    }
    function renderQuickLogin() {
        let users = getStorage(APP_PREFIX + 'savedUsers', []);
        let area = document.getElementById('quick-login-area');
        area.innerHTML = '';
        if(users.length) {
            area.innerHTML = '<div style="font-size:0.9em; color:#7f8c8d; margin-bottom:5px;">-- 快速登入 --</div>';
            users.forEach(u => {
                let d = document.createElement('div'); d.className = 'user-tag';
                d.innerHTML = `<img src="images/${u.avatar}" style="width:20px; border-radius:50%; margin-right:5px;">${u.name}`;
                d.onclick = () => { document.getElementById('username').value = u.name; currentAvatar = u.avatar; loginAndStart(); };
                area.appendChild(d);
            });
        }
    }
    function loginAndStart() {
        let name = document.getElementById('username').value.trim();
        if(!name) return alert("請輸入大名！");
        userName = name;
        
        // Save User
        let users = getStorage(APP_PREFIX + 'savedUsers', []).filter(u => u.name !== name);
        users.push({name, avatar: currentAvatar});
        setStorage(APP_PREFIX + 'savedUsers', users);

        if(!isPlaying) playMusic();
        returnToDash();
    }
    function logout() { location.reload(); }

    // --- Dashboard ---
    function returnToDash() {
        hideAllScreens();
        document.getElementById('dashboard-screen').style.display = 'block';
        document.getElementById('dash-name').innerText = userName;
        document.getElementById('dash-avatar').src = `images/${currentAvatar}`;
        
        renderLevelGrid();
        updateDashStats();
        checkStandardResume();
    }

    function renderLevelGrid() {
        let progress = getStorage(getKey('quizProgress'), { maxLevel: 1, scores: {} });
        let grid = document.getElementById('level-grid');
        grid.innerHTML = '';

        LEVEL_CONFIG.forEach((count, idx) => {
            let lvl = idx + 1;
            let btn = document.createElement('div');
            btn.className = 'level-btn-grid';
            
            if (lvl <= progress.maxLevel) {
                let score = progress.scores[lvl];
                let stars = '';
                if(score === 100) stars = '👑';
                else if(score >= 90) stars = '⭐⭐⭐';
                else if(score >= 80) stars = '⭐⭐';
                else if(score >= 70) stars = '⭐';
                
                btn.innerHTML = `<div class="level-num">${lvl}</div><div class="level-stars">${score !== undefined ? stars : '新'}</div>`;
                btn.onclick = () => startStandardQuiz(lvl);
            } else {
                btn.disabled = true;
                btn.setAttribute('disabled', 'true');
                btn.innerHTML = `<div class="level-num" style="font-size:1.2em">🔒</div>`;
            }
            grid.appendChild(btn);
        });
    }

    function updateDashStats() {
        document.getElementById('dash-mistake-count').innerText = getStorage(getKey('mistakeBank'), []).length;
        document.getElementById('dash-fav-count').innerText = getStorage(getKey('favoriteBank'), []).length;
    }

    // --- Standard Quiz Logic ---
    let stdState = { qList: [], idx: 0, answers: {}, score: 0, level: 1 };

    function checkStandardResume() {
        let save = getStorage(getKey('resume_standard'), null);
        document.getElementById('standard-resume-area').style.display = save ? 'block' : 'none';
    }

    function resumeStandardQuiz() {
        let save = getStorage(getKey('resume_standard'), null);
        if(!save) return;
        stdState = save;
        enterStandardScreen();
    }

    function startStandardQuiz(level) {
        // New Game
        setStorage(getKey('resume_standard'), null); // clear old save
        let start = 0;
        for(let i=0; i<level-1; i++) start += LEVEL_CONFIG[i];
        let end = start + LEVEL_CONFIG[level-1];
        
        stdState = {
            qList: allQuestions.slice(start, end),
            idx: 0,
            answers: {}, // { id: option }
            score: 0,
            level: level
        };
        enterStandardScreen();
    }

    function enterStandardScreen() {
        hideAllScreens();
        document.getElementById('quiz-content').style.display = 'block';
        document.getElementById('std-level-title').innerText = `第 ${stdState.level} 回`;
        document.getElementById('std-total').innerText = stdState.qList.length;
        renderStandardQuestion();
    }

    function renderStandardQuestion() {
        let q = stdState.qList[stdState.idx];
        document.getElementById('std-current').innerText = stdState.idx + 1;
        
        // Progress
        let pct = (stdState.idx / stdState.qList.length) * 100;
        document.getElementById('std-progress-bar').style.width = pct + "%";

        // Content
        // Remove duplicated "1. 1." if exists in text
        let qText = q.question.replace(/^\d+\.\s*\d+\.\s*/, '').replace(/^\d+\.\s*/, '');
        document.getElementById('std-question-text').innerText = (stdState.idx+1) + ". " + qText;
        
        let imgEl = document.getElementById('std-question-img');
        if(q.image) { imgEl.src = q.image; imgEl.style.display = 'block'; }
        else imgEl.style.display = 'none';

        // Options
        let optsDiv = document.getElementById('std-options-area');
        optsDiv.innerHTML = '';
        
        let savedAns = stdState.answers[q.id];
        let isAnswered = !!savedAns;

        // Favorite Btn Status
        updateStdFavBtn(q.id);

        q.options.forEach(opt => {
            let btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            
            if(isAnswered) {
                btn.disabled = true;
                let correctL = getLetter(q.answer);
                let thisL = getLetter(opt);
                let userL = getLetter(savedAns);
                
                if(thisL === correctL) btn.classList.add('correct');
                if(thisL === userL && userL !== correctL) btn.classList.add('wrong');
            } else {
                btn.onclick = () => checkStandardAnswer(btn, opt, q);
            }
            optsDiv.appendChild(btn);
        });

        // Explanation & Next Btn
        let expBox = document.getElementById('std-explanation');
        let nextBtn = document.getElementById('std-next-btn');
        if(isAnswered) {
            expBox.style.display = 'block';
            expBox.innerHTML = `<strong>💡 解析：</strong>${q.explanation || '暫無'}`;
            nextBtn.style.display = 'block';
        } else {
            expBox.style.display = 'none';
            nextBtn.style.display = 'none';
        }
    }

    function updateStdFavBtn(qid) {
        let favs = getStorage(getKey('favoriteBank'), []);
        let btn = document.getElementById('std-fav-btn');
        btn.innerText = favs.includes(qid) ? '❤️' : '🤍';
    }

    function toggleFavoriteStandard() {
        let qid = stdState.qList[stdState.idx].id;
        toggleFavLogic(qid);
        updateStdFavBtn(qid);
    }

    function checkStandardAnswer(btn, opt, q) {
        stdState.answers[q.id] = opt;
        let isCorrect = getLetter(opt) === getLetter(q.answer);
        if(isCorrect) {
            stdState.score++;
            audioCorrect.play();
            confetti({ particleCount: 30, origin: { y: 0.6 } });
        } else {
            audioFail.play();
            addMistake(q.id);
        }
        
        // Save
        setStorage(getKey('resume_standard'), stdState);
        renderStandardQuestion(); // Re-render to show colors
    }

    function nextStandardQuestion() {
        stdState.idx++;
        if(stdState.idx >= stdState.qList.length) {
            finishStandardQuiz();
        } else {
            setStorage(getKey('resume_standard'), stdState);
            renderStandardQuestion();
        }
    }

    function pauseStandardQuiz() {
        if(confirm("確定要暫離嗎？進度已自動儲存。")) returnToDash();
    }

    function finishStandardQuiz() {
        setStorage(getKey('resume_standard'), null); // clear save
        
        let finalScore = Math.round((stdState.score / stdState.qList.length) * 100);
        let progress = getStorage(getKey('quizProgress'), { maxLevel: 1, scores: {} });
        
        // Update High Score
        if(!progress.scores[stdState.level] || finalScore > progress.scores[stdState.level]) {
            progress.scores[stdState.level] = finalScore;
        }
        // Unlock Next
        if(finalScore >= PASS_SCORE && stdState.level === progress.maxLevel && stdState.level < LEVEL_CONFIG.length) {
            progress.maxLevel++;
            document.getElementById('unlock-msg').style.display = 'block';
        } else {
            document.getElementById('unlock-msg').style.display = 'none';
        }
        setStorage(getKey('quizProgress'), progress);
        
        // Add History
        addHistory(`第 ${stdState.level} 回`, finalScore);

        showScoreScreen(finalScore);
    }

    // --- Waterfall Mode Logic ---
    let wfState = { mode: 'speed', qList: [], answers: {}, score: 0 };
    // Save keys: resume_speed, resume_mistake, resume_favorite

    function initWaterfallMode(mode) {
        let saveKey = getKey(`resume_${mode}`);
        let save = getStorage(saveKey, null);
        
        if(save) {
            if(confirm("發現上次未完成的進度，是否繼續？\n按「確定」繼續，按「取消」重新開始。")) {
                wfState = save;
                enterWaterfallScreen();
                return;
            }
        }
        
        // Start New
        let list = [];
        if(mode === 'speed') {
            // Requirement 12: Ensure order matches JSON
            list = [...allQuestions]; 
        } else if(mode === 'mistake') {
            let ids = getStorage(getKey('mistakeBank'), []);
            if(!ids.length) return alert("目前沒有錯題！");
            list = allQuestions.filter(q => ids.includes(q.id));
        } else if(mode === 'favorite') {
            let ids = getStorage(getKey('favoriteBank'), []);
            if(!ids.length) return alert("目前沒有收藏！");
            list = allQuestions.filter(q => ids.includes(q.id));
        }

        wfState = { mode: mode, qList: list, answers: {}, score: 0 };
        setStorage(saveKey, wfState); // Initial save
        enterWaterfallScreen();
    }

    function enterWaterfallScreen() {
        hideAllScreens();
        document.getElementById('waterfall-screen').style.display = 'block';
        
        // UI Titles
        let map = { 'speed': '極速刷題', 'mistake': '複習錯題', 'favorite': '查看收藏' };
        document.getElementById('wf-mode-title').innerText = map[wfState.mode];
        
        renderWaterfallItems();
        updateWaterfallHeader();
    }

    function exitWaterfallMode() {
        if(confirm("確定要離開嗎？進度已自動儲存。")) {
            returnToDash();
        }
    }

    function updateWaterfallHeader() {
        let answeredCount = Object.keys(wfState.answers).length;
        let total = wfState.qList.length;
        let pct = total === 0 ? 0 : (answeredCount / total) * 100;
        
        document.getElementById('wf-score-display').innerText = `答對: ${wfState.score} / ${answeredCount}`;
        document.getElementById('wf-progress-bar').style.width = pct + "%";
    }

    function renderWaterfallItems() {
        let container = document.getElementById('waterfall-list');
        container.innerHTML = '';
        
        if(wfState.qList.length === 0) {
            container.innerHTML = '<div class="empty-state">這裡空空如也</div>';
            return;
        }

        wfState.qList.forEach((q, idx) => {
            let savedAns = wfState.answers[q.id];
            let isAnswered = !!savedAns;
            let isCorrect = isAnswered && (getLetter(savedAns) === getLetter(q.answer));

            let card = document.createElement('div');
            card.className = `wf-card ${isAnswered ? (isCorrect ? 'answered-correct' : 'answered-wrong') : ''}`;
            card.id = `wf-card-${q.id}`;

            // Tools (Heart & Delete)
            let isFav = getStorage(getKey('favoriteBank'), []).includes(q.id);
            let toolsHtml = `
                <div class="wf-card-tools">
                    <button class="wf-tool-btn wf-delete-btn" id="del-${q.id}" onclick="manualDelete(${q.id}, '${wfState.mode}')">🗑️</button>
                    <button class="wf-tool-btn" id="fav-${q.id}" onclick="toggleWaterfallFav(${q.id})" style="color:${isFav? 'var(--favorite-color)' : '#ccc'}">${isFav?'❤️':'🤍'}</button>
                </div>
            `;
            
            // Clean Text
            let qText = q.question.replace(/^\d+\.\s*\d+\.\s*/, '').replace(/^\d+\.\s*/, '');

            let imgHtml = q.image ? `<img src="${q.image}" class="wf-img">` : '';

            // Options
            let optsHtml = '';
            q.options.forEach(opt => {
                let cls = '';
                if(isAnswered) {
                    let correctL = getLetter(q.answer);
                    let thisL = getLetter(opt);
                    let userL = getLetter(savedAns);
                    if(thisL === correctL) cls += ' correct';
                    else if(thisL === userL) cls += ' wrong';
                    else if(!isCorrect && thisL === correctL) cls += ' missed'; // Show correct answer if wrong
                }
                optsHtml += `<button class="wf-option-btn ${cls}" ${isAnswered?'disabled':''} onclick="checkWaterfallAnswer(${q.id}, '${opt.replace(/'/g, "\\'")}')">${opt}</button>`;
            });

            // Explanation
            let expStyle = isAnswered ? 'display:block;' : '';
            
            card.innerHTML = `
                ${toolsHtml}
                <div class="wf-q-text">${idx+1}. ${qText}</div>
                ${imgHtml}
                <div class="wf-options">${optsHtml}</div>
                <div id="wf-exp-${q.id}" class="wf-explanation" style="${expStyle}">
                    <strong>💡 解析：</strong>${q.explanation || '暫無'}
                </div>
            `;
            container.appendChild(card);
            
            // Show Delete button only in specific modes
            if(wfState.mode === 'mistake' || wfState.mode === 'favorite') {
                document.getElementById(`del-${q.id}`).style.display = 'block';
            }
        });
    }

    function checkWaterfallAnswer(qid, opt) {
        // Find Q
        let qIndex = wfState.qList.findIndex(x => x.id === qid);
        let q = wfState.qList[qIndex];
        
        // Record
        wfState.answers[qid] = opt;
        let isCorrect = getLetter(opt) === getLetter(q.answer);
        
        // Logic
        if(isCorrect) {
            wfState.score++;
            audioCorrect.play();
        } else {
            audioFail.play();
            addMistake(qid); // Add to mistake bank
        }
        
        // Update DOM (Partial)
        updateWaterfallHeader();
        
        // Re-render specifically this card to update UI classes (lazy way: replace innerHTML or just classes)
        // For simplicity in this structure, we re-render the specific card logic logic or simpler:
        // Let's just re-render the whole list? No, jumpy.
        // Better: Replace the specific card's OuterHTML or modify classes manually. 
        // Let's reload the whole list, but keep scroll position.
        let scrollY = window.scrollY;
        renderWaterfallItems(); // Re-render to apply classes
        window.scrollTo(0, scrollY);

        // Save
        setStorage(getKey(`resume_${wfState.mode}`), wfState);
    }

    function toggleWaterfallFav(qid) {
        toggleFavLogic(qid);
        // Refresh heart icon
        let isFav = getStorage(getKey('favoriteBank'), []).includes(qid);
        let btn = document.getElementById(`fav-${qid}`);
        if(btn) {
            btn.innerHTML = isFav ? '❤️' : '🤍';
            btn.style.color = isFav ? 'var(--favorite-color)' : '#ccc';
        }
    }

    function manualDelete(qid, mode) {
        if(confirm("確定要刪除這題嗎？")) {
            if(confirm("真的確定嗎？刪除後將無法在這個模式中看到此題。")) {
                // Remove from Storage Bank
                if(mode === 'mistake') {
                    let bank = getStorage(getKey('mistakeBank'), []).filter(id => id !== qid);
                    setStorage(getKey('mistakeBank'), bank);
                } else if(mode === 'favorite') {
                    toggleFavLogic(qid); // logic handles removal if exists
                }
                
                // Remove from Current State List
                wfState.qList = wfState.qList.filter(q => q.id !== qid);
                delete wfState.answers[qid]; // Remove answer record too
                
                // Save State
                setStorage(getKey(`resume_${mode}`), wfState);
                
                // Animate removal
                let card = document.getElementById(`wf-card-${qid}`);
                card.style.transform = 'scale(0)';
                setTimeout(() => renderWaterfallItems(), 300);
            }
        }
    }

    // --- Core Logic ---
    function addMistake(id) {
        let b = getStorage(getKey('mistakeBank'), []);
        if(!b.includes(id)) { b.push(id); setStorage(getKey('mistakeBank'), b); }
    }
    
    function toggleFavLogic(id) {
        let b = getStorage(getKey('favoriteBank'), []);
        if(b.includes(id)) b = b.filter(x => x !== id);
        else b.push(id);
        setStorage(getKey('favoriteBank'), b);
    }

    function addHistory(modeName, score) {
        let h = getStorage(getKey('quizHistory'), []);
        h.push({
            date: new Date().toLocaleString(),
            mode: modeName,
            score: score,
            id: Date.now()
        });
        setStorage(getKey('quizHistory'), h);
    }

    // --- Results & Screens ---
    function hideAllScreens() {
        const ids = ['welcome-screen', 'dashboard-screen', 'quiz-content', 'waterfall-screen', 'score-box', 'history-screen', 'collection-screen'];
        ids.forEach(id => document.getElementById(id).style.display = 'none');
    }

    function showScoreScreen(score) {
        hideAllScreens();
        document.getElementById('score-box').style.display = 'block';
        document.getElementById('final-score').innerText = score;
        
        let cmt = "";
        if(score === 100) cmt = "🏆 廷尉奇才！";
        else if(score >= 90) cmt = "🌟 執法如山！";
        else if(score >= 70) cmt = "🎉 審判合格！";
        else cmt = "💪 尚需努力！";
        document.getElementById('score-comment').innerText = cmt;
        
        confetti({ particleCount: 150, spread: 100 });
    }

    function showHistory() {
        hideAllScreens();
        document.getElementById('history-screen').style.display = 'block';
        let list = document.getElementById('history-list');
        let data = getStorage(getKey('quizHistory'), []).reverse();
        
        list.innerHTML = '';
        if(!data.length) list.innerHTML = '<li style="text-align:center; color:#999;">尚無紀錄</li>';
        
        data.forEach(r => {
            let li = document.createElement('li');
            li.style = "background:#FFF; padding:15px; margin-bottom:10px; border-radius:8px; border:1px solid #ddd; display:flex; justify-content:space-between;";
            li.innerHTML = `
                <div>
                    <strong>${r.mode}</strong> <span style="color:${r.score>=70?'var(--correct-color)':'var(--wrong-color)'}">${r.score}分</span>
                    <div style="font-size:0.8em; color:#888;">${r.date}</div>
                </div>
            `;
            list.appendChild(li);
        });
    }

    function showCollection() {
        hideAllScreens();
        document.getElementById('collection-screen').style.display = 'block';
        let grid = document.getElementById('collection-grid');
        grid.innerHTML = '';
        
        let progress = getStorage(getKey('quizProgress'), {scores:{}});
        
        for(let i=1; i<=LEVEL_CONFIG.length; i++) {
            let score = progress.scores[i];
            let unlocked = score !== undefined && score >= 70;
            let imgNum = i < 10 ? '0'+i : i;
            let src = `images/card_${imgNum}.jpg`;
            
            let d = document.createElement('div');
            d.className = unlocked ? 'card-item' : 'card-item locked';
            d.innerHTML = `<img src="${src}" onerror="this.style.display='none'">`;
            
            if(unlocked) d.onclick = () => showModal(src, `第 ${i} 回證物`);
            else d.innerHTML += `<div style="position:absolute; top:40%; left:0; width:100%; text-align:center; font-size:2em;">🔒</div>`;
            
            grid.appendChild(d);
        }
    }

    function showModal(src, title) {
        document.getElementById('modal-img').src = src;
        document.getElementById('modal-title').innerText = title;
        document.getElementById('card-modal').style.display = 'flex';
    }
    function closeModal() { document.getElementById('card-modal').style.display = 'none'; }

</script>
</body>
</html>
